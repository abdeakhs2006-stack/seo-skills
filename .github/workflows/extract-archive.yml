name: Extract skills archive

on:
  push:
    branches: [claude/github-skills-monthly-LxiQT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-skills-monthly-LxiQT
      - name: Extract archive
        run: |
          set -euxo pipefail
          shopt -s nullglob dotglob
          ls -la
          ZIPS=( *.zip )
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No zip file at repo root; nothing to do."
            exit 0
          fi
          mkdir _ext
          for z in "${ZIPS[@]}"; do
            echo "Extracting $z"
            unzip -q "$z" -d _ext
            rm "$z"
          done
          for z in _ext/*.zip; do
            echo "Extracting nested $z"
            unzip -q "$z" -d _ext
            rm "$z"
          done
          ls -la _ext
          INNER=( _ext/*/ )
          if [ ${#INNER[@]} -ge 1 ]; then
            echo "Merging ${INNER[0]} into repo root using rsync"
            rsync -a "${INNER[0]}" ./
          fi
          rm -rf _ext
          rm -f .github/workflows/extract-archive.yml
          ls -la
      - name: Commit extracted contents
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract skills archive [skip ci]"
          git push origin HEAD:claude/github-skills-monthly-LxiQT

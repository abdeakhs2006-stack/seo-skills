name: Extract skills archive

on:
  push:
    branches: [claude/github-skills-monthly-LxiQT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-skills-monthly-LxiQT
      - run: ls -la && du -sh .

name: Extract skills archive

on:
  push:
    branches: [claude/github-skills-monthly-LxiQT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Hello
        run: echo "Job started on $(uname -a)"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/github-skills-monthly-LxiQT
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Show tree
        run: ls -la
      - name: Skip if no zip or already extracted
        id: precheck
        run: |
          set -eux
          shopt -s nullglob
          ZIPS=( *.zip )
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract archive
        if: steps.precheck.outputs.skip == 'false'
        run: |
          set -euxo pipefail
          shopt -s nullglob dotglob
          ZIPS=( *.zip )
          mkdir _ext
          for z in "${ZIPS[@]}"; do
            unzip -q "$z" -d _ext
            rm "$z"
          done
          for z in _ext/*.zip; do
            unzip -q "$z" -d _ext
            rm "$z"
          done
          INNER=( _ext/*/ )
          if [ ${#INNER[@]} -ge 1 ]; then
            rsync -a "${INNER[0]}" ./
          fi
          rm -rf _ext
          rm -f .github/workflows/extract-archive.yml
      - name: Commit and push
        if: steps.precheck.outputs.skip == 'false'
        run: |
          set -eux
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Extract skills archive [skip ci]"
          git push origin HEAD:claude/github-skills-monthly-LxiQT

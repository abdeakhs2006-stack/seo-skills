name: Extract skills archive

on:
  push:
    branches: [claude/github-skills-monthly-LxiQT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-skills-monthly-LxiQT
      - name: Inspect environment
        run: |
          which unzip && unzip -v | head -2
          ls -la
      - name: List zips
        run: |
          set -x
          shopt -s nullglob
          for z in *.zip; do
            echo "=== $z ==="
            unzip -l "$z" | head -20
          done

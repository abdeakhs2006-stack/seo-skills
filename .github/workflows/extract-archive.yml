name: Extract skills archive

on:
  push:
    branches: [claude/github-skills-monthly-LxiQT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-skills-monthly-LxiQT
      - name: Extract
        run: |
          set -x
          shopt -s nullglob
          mkdir _ext
          for z in *.zip; do
            echo "Extracting $z"
            unzip -q "$z" -d _ext
          done
          for z in _ext/*.zip; do
            echo "Extracting nested $z"
            unzip -q "$z" -d _ext
          done
          echo "=== After extraction ==="
          ls -la _ext
          du -sh _ext
          find _ext -maxdepth 2 -type d

name: Extract skills archive

on:
  push:
    branches: [claude/github-skills-monthly-LxiQT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-skills-monthly-LxiQT
      - name: Extract and merge
        run: |
          set -x
          shopt -s nullglob dotglob
          mkdir _ext
          for z in *.zip; do
            unzip -q "$z" -d _ext
            rm "$z"
          done
          for z in _ext/*.zip; do
            unzip -q "$z" -d _ext
            rm "$z"
          done
          ls -la _ext
          INNER=( _ext/*/ )
          echo "INNER=${INNER[@]}"
          if [ ${#INNER[@]} -ge 1 ]; then
            rsync -a "${INNER[0]}" ./
          fi
          rm -rf _ext
          echo '=== Repo root after merge ==='
          ls -la
          echo '=== git status (top 60) ==='
          git status --short | head -60 || true

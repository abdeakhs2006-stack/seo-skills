name: Extract skills archive

on:
  push:
    branches: [claude/github-skills-monthly-LxiQT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-skills-monthly-LxiQT
      - name: Extract and merge
        run: |
          set -x
          shopt -s nullglob dotglob
          mkdir _ext
          for z in *.zip; do
            unzip -q "$z" -d _ext
            rm "$z"
          done
          for z in _ext/*.zip; do
            unzip -q "$z" -d _ext
            rm "$z"
          done
          INNER=( _ext/*/ )
          if [ ${#INNER[@]} -ge 1 ]; then
            rsync -a "${INNER[0]}" ./
          fi
          rm -rf _ext
          rm -f .github/workflows/extract-archive.yml
      - name: Stage
        run: |
          set -x
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          echo "=== Stats ==="
          git diff --cached --shortstat
      - name: Commit
        run: |
          set -x
          git commit -m "Extract skills archive [skip ci]" && echo COMMIT_OK || { echo "COMMIT_FAILED rc=$?"; exit 1; }
      - name: Push
        run: |
          set -x
          git push origin HEAD:claude/github-skills-monthly-LxiQT && echo PUSH_OK || { echo "PUSH_FAILED rc=$?"; exit 1; }
